    <circle cx="100" cy="100" r="150" fill="#FF6B35" opacity="0.05"/>
    <circle cx="1100" cy="530" r="180" fill="#FF6B35" opacity="0.05"/>

    <!-- Logo Background -->
    <rect x="150" y="230" width="140" height="140" rx="18" fill="#1B2838" stroke="#FF6B35" stroke-width="2"/>

    <!-- BIM Icon (scaled) -->
    <rect x="248" y="248" width="8" height="75" fill="#FF6B35"/>
